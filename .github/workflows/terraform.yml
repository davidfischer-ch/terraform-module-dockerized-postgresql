---
# Check the module on every push and pull request: formatting, validation and its tests, on the
# Terraform release `required_version` names, with the newest Docker provider and with its minimum.
name: Terraform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [newest, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: '1.17'
          terraform_wrapper: false
      - if: matrix.provider == 'minimum'
        run: |
          cat > versions_override.tf <<'HCL'
          terraform {
            required_providers {
              docker = { source = "kreuzwerker/docker", version = "= 4.7.0" }
            }
          }
          HCL
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  # The module against the runner's Docker daemon: tests/e2e/run.sh, on PostgreSQL and TimescaleDB.
  # The same scenarios as the Terraform E2E job of .gitlab-ci.yml.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: postgres:18.1
            settings: ''
          - image: timescale/timescaledb:2.32.0-pg18
            settings: >-
              {shared_preload_libraries = "timescaledb", "timescaledb.telemetry_level" = "off"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: '1.17'
          terraform_wrapper: false
      - run: >-
          sudo env "PATH=$PATH" "E2E_IMAGE=$E2E_IMAGE" "E2E_SETTINGS=$E2E_SETTINGS"
          sh tests/e2e/run.sh
        env:
          E2E_IMAGE: ${{ matrix.image }}
          E2E_SETTINGS: ${{ matrix.settings }}
...
