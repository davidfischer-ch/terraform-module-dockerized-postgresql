---
include:
  - project: family/infrastructure/pipelines/development-pipelines
    file: pipelines/terraform/module.yml
    ref: main

# The same scenarios as the e2e job of .github/workflows/terraform.yml.
Terraform E2E:
  parallel:
    matrix:
      - E2E_IMAGE: postgres:18.1
        E2E_SETTINGS: ''
      - E2E_IMAGE: timescale/timescaledb:2.32.0-pg18
        E2E_SETTINGS: >-
          {shared_preload_libraries = "timescaledb", "timescaledb.telemetry_level" = "off"}
...
